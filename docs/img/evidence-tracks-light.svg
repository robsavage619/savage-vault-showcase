<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 318" width="900" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title id="t">Three frontmatter fields that move independently</title>
  <desc id="d">status records whether a page is integrated: draft, active, stale, needs-review. validation_status records review: unreviewed, reviewed, validated, with disputed and deprecated as side states. fidelity_status records how much of the source was read: abstract-only, source-checked, quote-checked, full-text-checked. A page can be active and still abstract-only.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#59636e"/></marker>
  </defs>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#1f2328">
    <text x="16" y="46">status</text>
    <text x="16" y="146">validation_status</text>
    <text x="16" y="246">fidelity_status</text>
  </g>
  <g font-size="12" fill="#59636e">
    <text x="16" y="66">is the page integrated?</text>
    <text x="16" y="166">has the claim been reviewed?</text>
    <text x="16" y="266">how much of the source was read?</text>
  </g>

  <path d="M16 100H884M16 200H884" stroke="#d1d9e0" stroke-width="1"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" text-anchor="middle" fill="#1f2328">
    <!-- status -->
    <rect x="250" y="30" width="120" height="36" rx="18" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="310" y="53">draft</text>
    <rect x="400" y="30" width="120" height="36" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="460" y="53" fill="#7c3aed" font-weight="600">active</text>
    <rect x="550" y="30" width="120" height="36" rx="18" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="610" y="53">stale</text>
    <rect x="700" y="30" width="150" height="36" rx="18" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="775" y="53">needs-review</text>

    <!-- validation_status -->
    <rect x="250" y="130" width="120" height="36" rx="18" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="310" y="153">unreviewed</text>
    <rect x="400" y="130" width="120" height="36" rx="18" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="460" y="153">reviewed</text>
    <rect x="550" y="130" width="120" height="36" rx="18" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="610" y="153" fill="#1a7f37" font-weight="600">validated</text>
    <rect x="700" y="112" width="150" height="32" rx="16" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/><text x="775" y="133" fill="#9a6700" font-weight="600">disputed</text>
    <rect x="700" y="152" width="150" height="32" rx="16" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="775" y="173">deprecated</text>

    <!-- fidelity_status -->
    <rect x="250" y="230" width="132" height="36" rx="18" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/><text x="316" y="253" fill="#9a6700" font-weight="600">abstract-only</text>
    <rect x="406" y="230" width="132" height="36" rx="18" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="472" y="253">source-checked</text>
    <rect x="562" y="230" width="132" height="36" rx="18" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="628" y="253">quote-checked</text>
    <rect x="718" y="230" width="150" height="36" rx="18" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="793" y="253" fill="#1a7f37" font-weight="600">full-text-checked</text>
  </g>

  <g stroke="#59636e" stroke-width="1.5" marker-end="url(#a)">
    <path d="M372 148H398"/><path d="M522 148H548"/>
    <path d="M384 248H404"/><path d="M540 248H560"/><path d="M696 248H716"/>
  </g>

  <g font-size="12" fill="#59636e">
    <text x="460" y="86" text-anchor="middle">integrated, nothing more</text>
    <text x="316" y="288" text-anchor="middle" fill="#9a6700">fine for orientation,</text>
    <text x="316" y="304" text-anchor="middle" fill="#9a6700">never for a prescription</text>
  </g>
</svg>
