<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 476" width="900" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title id="t">System shape: how an agent is routed through the vault</title>
  <desc id="d">An agent starts at START HERE, then agent-entry, then the question-router. The router sends it to retrieval packs, project manifests or domain overviews. Retrieval packs lead to playbooks, source summaries and concept cards, which all end at the validation checklist. Project manifests lead to live repository inspection.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9198a1"/></marker>
  </defs>

  <g fill="none" stroke="#9198a1" stroke-width="1.5">
    <path d="M450 56V78" marker-end="url(#a)"/>
    <path d="M450 120V142" marker-end="url(#a)"/>
    <path d="M450 184V204M250 204H800"/>
    <path d="M250 204V222" marker-end="url(#a)"/>
    <path d="M600 204V222" marker-end="url(#a)"/>
    <path d="M800 204V222" marker-end="url(#a)"/>
    <path d="M250 276V297M100 297H400"/>
    <path d="M100 297V316" marker-end="url(#a)"/>
    <path d="M250 297V316" marker-end="url(#a)"/>
    <path d="M400 297V316" marker-end="url(#a)"/>
    <path d="M600 276V316" marker-end="url(#a)"/>
    <path d="M100 366V389H400V366M250 366V389"/>
    <path d="M250 389V410" marker-end="url(#a)"/>
  </g>

  <g text-anchor="middle" font-size="12" fill="#9198a1">
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" font-weight="600" fill="#a78bfa">
      <rect x="350" y="16" width="200" height="40" rx="10" fill="#2a2150" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="450" y="41">START HERE</text>
      <rect x="350" y="80" width="200" height="40" rx="10" fill="#2a2150" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="450" y="105">agent-entry</text>
      <rect x="350" y="144" width="200" height="40" rx="10" fill="#2a2150" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="450" y="169">question-router</text>
    </g>
    <text x="566" y="41" text-anchor="start">every session begins here</text>
    <text x="566" y="169" text-anchor="start">classifies the task before any content opens</text>

    <rect x="160" y="224" width="180" height="52" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
    <text x="250" y="246" font-size="14.5" font-weight="600" fill="#e6edf3">Retrieval packs</text>
    <text x="250" y="264">curated route for one domain</text>

    <rect x="510" y="224" width="180" height="52" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
    <text x="600" y="246" font-size="14.5" font-weight="600" fill="#e6edf3">Project manifests</text>
    <text x="600" y="264">read-first map of a project</text>

    <rect x="725" y="224" width="150" height="52" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
    <text x="800" y="246" font-size="14.5" font-weight="600" fill="#e6edf3">Domain overviews</text>
    <text x="800" y="264">map of a domain</text>

    <rect x="32" y="318" width="136" height="48" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
    <text x="100" y="339" font-size="14" font-weight="600" fill="#e6edf3">Playbooks</text>
    <text x="100" y="356">how to do the task</text>

    <rect x="182" y="318" width="136" height="48" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
    <text x="250" y="339" font-size="14" font-weight="600" fill="#e6edf3">Source summaries</text>
    <text x="250" y="356">what a source says</text>

    <rect x="332" y="318" width="136" height="48" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
    <text x="400" y="339" font-size="14" font-weight="600" fill="#e6edf3">Concept cards</text>
    <text x="400" y="356">reusable decision rules</text>

    <rect x="490" y="318" width="220" height="48" rx="10" fill="#12261e" stroke="#3fb950" stroke-width="1.5"/>
    <text x="600" y="339" font-size="14" font-weight="600" fill="#e6edf3">Live repository inspection</text>
    <text x="600" y="356">the authority on current state</text>

    <rect x="140" y="412" width="220" height="48" rx="10" fill="#2e2a14" stroke="#d29922" stroke-width="1.5"/>
    <text x="250" y="433" font-size="14" font-weight="600" fill="#e6edf3">Validation checklist</text>
    <text x="250" y="450">the gate before any claim</text>
  </g>
</svg>
